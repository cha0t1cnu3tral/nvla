name: Linux Port Gate

on:
  push:
    branches:
      - linux-port
      - linux-port/**
  pull_request:
    branches:
      - linux-port
      - linux-port/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  pythonVersion: "3.13.11"

jobs:
  focusedLinuxPortTests:
    name: Focused Linux port tests
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.pythonVersion }}
          architecture: x64
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: cpython-${{ env.pythonVersion }}-windows-x86_64-none
      - name: Run focused Linux port tests
        shell: pwsh
        run: uv run --no-project python tests/linuxPortUnitRunner.py
